<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>UniBite</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css">
</head>

<body>

<div class="bg-shape bg-shape-1"></div>
<div class="bg-shape bg-shape-2"></div>

<header>
  <h1>🍽️ UniBite</h1>

  <div>
    <div class="user-box">
      <span id="userInfo"></span>
      <span id="userPoints"></span>
    </div>

    <button onclick="logout()">Logout</button>
  </div>
</header>
<main>

  <!-- COOK -->
  <section id="addMealSection" class="form-section">
    <h2>Πρόσθεσε φαγητό</h2>

    <form id="mealForm">

      <input type="text" id="title" placeholder="Τίτλος" required>

      <input type="text" id="description" placeholder="Περιγραφή" required>

      <input type="number" id="portions" placeholder="Μερίδες" min="0" required>

      <label>Αλλεργιογόνα:</label>

      <div class="allergens-grid">
        <label><input type="checkbox" name="allergen" value="Γλουτένη"> Γλουτένη</label>
        <label><input type="checkbox" name="allergen" value="Γάλα"> Γάλα</label>
        <label><input type="checkbox" name="allergen" value="Αυγά"> Αυγά</label>

        <label><input type="checkbox" name="allergen" value="Ξηροί καρποί"> Ξηροί καρποί</label>
        <label><input type="checkbox" name="allergen" value="Σόγια"> Σόγια</label>
        <label><input type="checkbox" name="allergen" value="Ψάρι"> Ψάρι</label>

        <label><input type="checkbox" name="allergen" value="Οστρακοειδή"> Οστρακοειδή</label>
        <label><input type="checkbox" name="allergen" value="Σουσάμι"> Σουσάμι</label>
        <label><input type="checkbox" name="allergen" value="Μουστάρδα"> Μουστάρδα</label>
      </div>

      <input
        type="text"
        id="location"
        placeholder="Διεύθυνση / Τοποθεσία"
        required
      >

      <button type="button" onclick="searchPickupLocation()">
        Εύρεση στον χάρτη
      </button>

      <p class="map-help">
        Πάτα στον χάρτη ή σύρε το marker.
      </p>

      <div id="pickMap"></div>

      <input type="datetime-local" id="pickup_time" required>

      <input type="number" id="price" placeholder="Τιμή (€)" min="0" step="0.01" required>

      <button type="submit">Προσθήκη</button>

    </form>
  </section>

  <!-- CONSUMER -->
  <section id="consumerTools" class="form-section">
    <h2>Αγγελίες φαγητού</h2>

    <div class="toolbar">
      <input
        type="text"
        id="userLocation"
        placeholder="Η τοποθεσία μου"
      >

      <input
        type="number"
        id="maxResults"
        placeholder="Μέγιστος αριθμός αποτελεσμάτων"
        min="1"
      >

      <button onclick="sortByDistance()">
        Ταξινόμηση κοντινότερων
      </button>
    </div>
  <div class="form-section">
    <h2>Χάρτης</h2>
    <div id="map"></div>
  </div>
</section>

  <!-- LIST -->
  <section class="meals-section form-section">
    <h2>Λίστα αγγελιών</h2>
    <div id="mealsList"></div>
  </section>

  <!-- REQUESTS -->
<!-- MY REQUESTS / CONSUMER -->
<section id="myRequestsSection" class="form-section">
  <div class="requests-header">
    <h2>📦 Τα αιτήματά μου</h2>

    <button id="toggleRequestsBtn" onclick="toggleRequests()">
      Εμφάνιση / Απόκρυψη
    </button>
  </div>

  <div id="requestsList" style="display:none;"></div>
</section>

</main>

<!-- RATING MODAL -->
<div id="ratingModal" class="modal">
  <div class="modal-content">

    <h2>Αξιολόγηση γεύματος</h2>

    <p>Βάλε βαθμολογία από 1 έως 5:</p>

    <select id="ratingSelect">
      <option value="1">⭐ 1</option>
      <option value="2">⭐⭐ 2</option>
      <option value="3">⭐⭐⭐ 3</option>
      <option value="4">⭐⭐⭐⭐ 4</option>
      <option value="5">⭐⭐⭐⭐⭐ 5</option>
    </select>

    <br><br>

    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="closeRatingModal()" style="background:gray;">
        Άκυρο
      </button>

      <button onclick="submitRating()">
        Υποβολή αξιολόγησης
      </button>
    </div>

  </div>
</div>


<!-- MODAL -->
<div id="requestModal" class="modal">
  <div class="modal-content">

    <h2 id="mealTitle"></h2>

    <label>Σημείωση:</label>
    <input type="text" id="requestNote">

    <label>Μερίδες:</label>
    <select id="portionSelect"></select>

    <br><br>

    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="closeModal()" style="background:gray;">
        Back
      </button>

      <button onclick="submitRequest()">
        Confirm
      </button>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js"></script>

<script src="script.js"></script>

</body>
</html>
