<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>UniBite</title>

  <link rel="stylesheet" href="style.css">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.css">
</head>

<body>

<div class="bg-shape bg-shape-1"></div>
<div class="bg-shape bg-shape-2"></div>

<header>
  <h1>🍽️ UniBite</h1>
  <div>
    <span id="userInfo"></span>
    <button onclick="logout()">Logout</button>
  </div>
</header>

<main>

  <section id="addMealSection" class="form-section">
    <h2>Πρόσθεσε φαγητό</h2>

    <form id="mealForm">
      <input type="text" id="title" placeholder="Τίτλος" required>
      <input type="text" id="description" placeholder="Περιγραφή" required>
      <input type="number" id="portions" placeholder="Μερίδες" min="0" required>

      <input 
        type="text" 
        id="location" 
        placeholder="Διεύθυνση / Τοποθεσία π.χ. CEID, Πάτρα" 
        required
      >

      <button type="button" onclick="searchPickupLocation()">
        Εύρεση στον χάρτη
      </button>

      <p class="map-help">
        Πάτα στον χάρτη ή σύρε το marker για να διορθώσεις το ακριβές σημείο παραλαβής.
      </p>

      <div id="pickMap"></div>

      <input type="datetime-local" id="pickup_time" required>
      <input type="number" id="price" placeholder="Τιμή (€)" min="0" step="0.01" required>

      <button type="submit">Προσθήκη</button>
    </form>
  </section>

  <section id="consumerTools" class="form-section">
    <h2>Αγγελίες φαγητού</h2>

    <div class="toolbar">
      <input
        type="text"
        id="userLocation"
        placeholder="Γράψε τη διεύθυνσή σου"
      >

      <button onclick="sortByDistance()">Ταξινόμηση κοντινότερων</button>
    </div>
  </section>

  <section class="consumer-layout">
    <div class="form-section">
      <h2>Λίστα αγγελιών</h2>
      <div id="mealsList"></div>
    </div>

    <div class="form-section">
      <h2>Χάρτης</h2>
      <div id="map"></div>
    </div>
  </section>

  <section id="requestsSection" class="form-section">
    <h2>Αιτήματα</h2>
    <div id="requestsList"></div>
  </section>

</main>

<div id="requestModal" class="modal">
  <div class="modal-content">

    <h2 id="mealTitle"></h2>

    <label>Σημείωση:</label>
    <input type="text" id="requestNote" placeholder="π.χ. χωρίς αλάτι">

    <label>Μερίδες:</label>
    <select id="portionSelect"></select>

    <br><br>

    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="closeModal()" style="background:gray;">Back</button>
      <button onclick="submitRequest()">Confirm</button>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.fullscreen@1.6.0/Control.FullScreen.js"></script>
<script src="script.js"></script>

</body>
</html>
