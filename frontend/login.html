<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>UniBite - Login</title>

  <link rel="stylesheet" href="style.css">

  <!-- TOASTR CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
</head>
<body>

<header>
  <h1>🍽️ UniBite</h1>
  <p>Μοιράσου φαγητό, βοήθησε άλλους</p>
</header>

<main>

  <!-- LOGIN -->
  <section id="loginSection" class="form-section">
    <h2>Σύνδεση</h2>

    <form id="loginForm">
      <input type="email" id="loginEmail" placeholder="Email" required>
      <input type="password" id="loginPassword" placeholder="Password" required>

      <button type="submit">Σύνδεση</button>
    </form>

    <p>
      Δεν έχεις λογαριασμό;
      <button type="button" id="showRegisterBtn">Κάνε εγγραφή</button>
    </p>
  </section>

  <!-- REGISTER -->
  <section id="registerSection" class="form-section" style="display: none;">
    <h2>Εγγραφή</h2>

    <form id="registerForm">
      <input type="text" id="regUsername" placeholder="Username" required>
      <input type="email" id="regEmail" placeholder="Email" required>
      <input type="password" id="regPassword" placeholder="Password" required>

      <select id="regRole" required>
        <option value="">Επίλεξε ρόλο</option>
        <option value="cook">🍳 Μάγειρας</option>
        <option value="consumer">🧍 Καταναλωτής</option>
      </select>

      <button type="submit">Εγγραφή</button>
    </form>

    <p>
      Έχεις ήδη λογαριασμό;
      <button type="button" id="showLoginBtn">Σύνδεση</button>
    </p>
  </section>

</main>

<!-- TOASTR JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>

<script src="auth.js"></script>
</body>
</html>
